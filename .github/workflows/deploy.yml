# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "lgharo"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: lgharo/prova_intermediaria_proj_soft-ci:${{ github.sha }}

      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop prova_intermediaria_proj_soft
            docker rm --force prova_intermediaria_proj_soft
            docker run -d \
            -p 8080:8080 \
            --name prova_intermediaria_proj_soft \
            --network rede \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres-prova:5432/provadb" \
            -e SPRING_DATASOURCE_USERNAME="usuario" \
            -e SPRING_DATASOURCE_PASSWORD="senha" \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
            lgharo/prova_intermediaria_proj_soft-ci:${{ github.sha }}
